<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="600" height="600" viewBox="0 0 600 600"
     data-scale="0.02" data-floor="1">

    <!-- Центральный холл -->
    <rect x="250" y="250" width="100" height="100"
          data-type="corridor" data-id="C_hall"
          data-capacity="20" data-width="2.0"
          fill="#fdfde0" stroke="#555" stroke-width="2"/>

    <!-- 4 комнаты -->
    <rect x="250" y="50"  width="100" height="150"
          data-type="room" data-id="R_top" data-capacity="4" data-name="Север"
          fill="#e6e6fa" stroke="#555" stroke-width="2"/>
    <rect x="250" y="400" width="100" height="150"
          data-type="room" data-id="R_bottom" data-capacity="4" data-name="Юг"
          fill="#e6e6fa" stroke="#555" stroke-width="2"/>
    <rect x="50"  y="250" width="150" height="100"
          data-type="room" data-id="R_left" data-capacity="4" data-name="Запад"
          fill="#e6e6fa" stroke="#555" stroke-width="2"/>
    <rect x="400" y="250" width="150" height="100"
          data-type="room" data-id="R_right" data-capacity="4" data-name="Восток"
          fill="#e6e6fa" stroke="#555" stroke-width="2"/>

    <!-- Двери со всех сторон -->
    <line x1="280" y1="200" x2="320" y2="200" data-type="door" data-id="D_top"
          data-connects="R_top,C_hall" data-width="0.9" stroke="#c00" stroke-width="6"/>
    <line x1="280" y1="400" x2="320" y2="400" data-type="door" data-id="D_bottom"
          data-connects="R_bottom,C_hall" data-width="0.9" stroke="#c00" stroke-width="6"/>
    <line x1="200" y1="280" x2="200" y2="320" data-type="door" data-id="D_left"
          data-connects="R_left,C_hall" data-width="0.9" stroke="#c00" stroke-width="6"/>
    <line x1="400" y1="280" x2="400" y2="320" data-type="door" data-id="D_right"
          data-connects="R_right,C_hall" data-width="0.9" stroke="#c00" stroke-width="6"/>

    <!-- Выход из R_top наружу -->
    <line x1="280" y1="50" x2="320" y2="50" data-type="exit" data-id="E_top"
          data-connects="R_top,OUTSIDE" data-throughput="1.5" data-width="1.2"
          stroke="#2a2" stroke-width="8"/>

    <!-- Выход из R_bottom наружу -->
    <line x1="280" y1="550" x2="320" y2="550" data-type="exit" data-id="E_bottom"
          data-connects="R_bottom,OUTSIDE" data-throughput="1.5" data-width="1.2"
          stroke="#2a2" stroke-width="8"/>
</svg>