<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="800" viewBox="0 0 1200 800"
     data-scale="0.015" data-floor="3">

    <!-- Центральный коридор -->
    <rect x="100" y="350" width="1000" height="120"
          data-type="corridor" data-id="C_main"
          data-capacity="30" data-width="1.8"
          fill="#fdfde0" stroke="#555" stroke-width="2"/>

    <!-- Верхний ряд кабинетов -->
    <rect x="100" y="80"  width="200" height="270"
          data-type="room" data-id="R101" data-capacity="8" data-name="Переговорная"
          fill="#e6e6fa" stroke="#555" stroke-width="2"/>
    <rect x="300" y="80"  width="200" height="270"
          data-type="room" data-id="R102" data-capacity="4" data-name="Бухгалтерия"
          fill="#e6e6fa" stroke="#555" stroke-width="2"/>
    <rect x="500" y="80"  width="200" height="270"
          data-type="room" data-id="R103" data-capacity="12" data-name="Open space"
          fill="#e6e6fa" stroke="#555" stroke-width="2"/>
    <rect x="700" y="80"  width="200" height="270"
          data-type="room" data-id="R104" data-capacity="2" data-name="Директор"
          fill="#e6e6fa" stroke="#555" stroke-width="2"/>
    <rect x="900" y="80"  width="200" height="270"
          data-type="room" data-id="R105" data-capacity="6" data-name="Отдел кадров"
          fill="#e6e6fa" stroke="#555" stroke-width="2"/>

    <!-- Нижний ряд кабинетов -->
    <rect x="100" y="470" width="200" height="250"
          data-type="room" data-id="R106" data-capacity="10" data-name="Техподдержка"
          fill="#e6e6fa" stroke="#555" stroke-width="2"/>
    <rect x="300" y="470" width="200" height="250"
          data-type="room" data-id="R107" data-capacity="6" data-name="Маркетинг"
          fill="#e6e6fa" stroke="#555" stroke-width="2"/>
    <rect x="500" y="470" width="200" height="250"
          data-type="room" data-id="R108" data-capacity="4" data-name="Серверная"
          fill="#e6e6fa" stroke="#555" stroke-width="2"/>
    <rect x="700" y="470" width="200" height="250"
          data-type="room" data-id="R109" data-capacity="8" data-name="Кухня"
          fill="#e6e6fa" stroke="#555" stroke-width="2"/>
    <rect x="900" y="470" width="200" height="250"
          data-type="room" data-id="R110" data-capacity="6" data-name="Архив"
          fill="#e6e6fa" stroke="#555" stroke-width="2"/>

    <!-- Двери верхнего ряда -->
    <line x1="150" y1="350" x2="250" y2="350" data-type="door" data-id="D101"
          data-connects="R101,C_main" data-throughput="1.0" data-width="1.0"
          stroke="#c00" stroke-width="6"/>
    <line x1="350" y1="350" x2="450" y2="350" data-type="door" data-id="D102"
          data-connects="R102,C_main" data-width="0.9" stroke="#c00" stroke-width="6"/>
    <line x1="550" y1="350" x2="650" y2="350" data-type="door" data-id="D103"
          data-connects="R103,C_main" data-throughput="1.5" data-width="1.2"
          stroke="#c00" stroke-width="6"/>
    <line x1="750" y1="350" x2="850" y2="350" data-type="door" data-id="D104"
          data-connects="R104,C_main" data-width="0.9" stroke="#c00" stroke-width="6"/>
    <line x1="950" y1="350" x2="1050" y2="350" data-type="door" data-id="D105"
          data-connects="R105,C_main" data-width="0.9" stroke="#c00" stroke-width="6"/>

    <!-- Двери нижнего ряда -->
    <line x1="150" y1="470" x2="250" y2="470" data-type="door" data-id="D106"
          data-connects="R106,C_main" data-throughput="1.2" data-width="1.0"
          stroke="#c00" stroke-width="6"/>
    <line x1="350" y1="470" x2="450" y2="470" data-type="door" data-id="D107"
          data-connects="R107,C_main" data-width="0.9" stroke="#c00" stroke-width="6"/>
    <line x1="550" y1="470" x2="650" y2="470" data-type="door" data-id="D108"
          data-connects="R108,C_main" data-throughput="2.0" data-width="1.4"
          stroke="#c00" stroke-width="6"/>
    <line x1="750" y1="470" x2="850" y2="470" data-type="door" data-id="D109"
          data-connects="R109,C_main" data-width="0.9" stroke="#c00" stroke-width="6"/>
    <line x1="950" y1="470" x2="1050" y2="470" data-type="door" data-id="D110"
          data-connects="R110,C_main" data-width="0.9" stroke="#c00" stroke-width="6"/>

    <!-- Два аварийных выхода по торцам коридора -->
    <line x1="100" y1="380" x2="100" y2="440" data-type="exit" data-id="E_left"
          data-connects="C_main,OUTSIDE" data-throughput="2.5" data-width="1.4"
          stroke="#2a2" stroke-width="8"/>
    <line x1="1100" y1="380" x2="1100" y2="440" data-type="exit" data-id="E_right"
          data-connects="C_main,OUTSIDE" data-throughput="2.5" data-width="1.4"
          stroke="#2a2" stroke-width="8"/>
</svg>