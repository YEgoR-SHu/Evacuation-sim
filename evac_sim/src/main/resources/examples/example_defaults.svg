<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="400" height="400" viewBox="0 0 400 400"
     data-scale="0.05" data-floor="1">

    <!-- Коридор без data-width — ширина = меньшая сторона bbox × scale -->
    <rect x="50" y="50" width="300" height="100"
          data-type="corridor" data-id="C1" data-capacity="5"
          fill="#fdfde0" stroke="#555" stroke-width="2"/>

    <!-- Комната без data-area — площадь = bbox.w × bbox.h × scale² -->
    <rect x="50" y="200" width="140" height="140"
          data-type="room" data-id="R1" data-capacity="3" data-name="Без data-area"
          fill="#e6e6fa" stroke="#555" stroke-width="2"/>

    <rect x="210" y="200" width="140" height="140"
          data-type="room" data-id="R2" data-capacity="3" data-name="Вторая"
          fill="#e6e6fa" stroke="#555" stroke-width="2"/>

    <!-- Двери без data-throughput и data-width — дефолты 1.0 и bbox×scale -->
    <line x1="100" y1="150" x2="150" y2="150" data-type="door" data-id="D1"
          data-connects="R1,C1" stroke="#c00" stroke-width="6"/>
    <line x1="250" y1="150" x2="300" y2="150" data-type="door" data-id="D2"
          data-connects="R2,C1" stroke="#c00" stroke-width="6"/>

    <!-- Выход без data-throughput -->
    <line x1="50" y1="80" x2="50" y2="120" data-type="exit" data-id="E1"
          data-connects="C1,OUTSIDE" stroke="#2a2" stroke-width="8"/>
</svg>