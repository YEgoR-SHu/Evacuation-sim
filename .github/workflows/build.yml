name: Build and verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unified:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build and test all modules and packaged frontend
        run: mvn -B clean verify
      - name: Check playback
        run: npm --prefix web test
      - name: Install browser
        run: npm --prefix web exec -- playwright install --with-deps chromium
      - name: Check packaged CLI
        run: java -Djava.awt.headless=true -jar evac_sim/target/evac-sim-0.3.0-standalone.jar examples/example.svg
      - name: Check packaged platform in browser
        env:
          DB_PATH: /tmp/evac-ci.db
          PORT: '8080'
        run: |
          java -Djava.awt.headless=true -jar server/target/evacuation-sim-0.3.0.jar > /tmp/evac-server.log 2>&1 &
          EVAC_PID=$!
          trap 'kill "$EVAC_PID"' EXIT
          node scripts/browser-smoke.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: evacuation-sim-0.3.0
          path: |
            server/target/evacuation-sim-0.3.0.jar
            evac_sim/target/evac-sim-0.3.0-standalone.jar
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-evidence
          path: test-results/
